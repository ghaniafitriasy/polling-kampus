name: polling-kampus

services:
  backend:
    build: .
    container_name: polling-backend
    restart: unless-stopped
    ports:
      - "5000:5000"            # dibuka ke laptop agar API bisa diuji lewat Postman
    volumes:
      # NAMED VOLUME: tempat data votes.json. Tetap ada walau container dihapus.
      - polling-db-data:/var/lib/backend_data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    image: nginx:alpine
    container_name: polling-frontend
    restart: unless-stopped
    ports:
      - "8081:80"              # buka http://localhost:8081 (8080 dipakai Jenkins)
    volumes:
      # BIND MOUNT: file di laptop langsung dipakai Nginx. Edit index.html, refresh, langsung berubah.
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    name: app-net
    driver: bridge

volumes:
  polling-db-data:
    name: polling-db-data
