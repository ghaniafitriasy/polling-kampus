server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Agar perubahan index.html langsung terlihat saat demo bind mount
    add_header Cache-Control "no-store" always;

    # Resolver bawaan Docker. Nama "backend" di-resolve ulang tiap beberapa detik,
    # jadi setelah container backend dihapus lalu dibuat lagi (IP bisa berubah),
    # Nginx tetap menemukannya tanpa perlu di-restart.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # /api/votes -> http://backend:5000/votes
    location /api/ {
        set $backend_upstream http://backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
